<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema de Votación en Línea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tinta: "#172033",
              noche: "#0f172a",
              urna: "#2563eb",
              acento: "#22c55e",
            },
            boxShadow: {
              suave: "0 24px 80px rgba(15, 23, 42, 0.16)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute -left-20 top-0 h-80 w-80 rounded-full bg-blue-600/30 blur-3xl"></div>
      <div class="absolute bottom-0 right-0 h-96 w-96 rounded-full bg-emerald-500/20 blur-3xl"></div>
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(255,255,255,0.12),transparent_34%),linear-gradient(135deg,#0f172a,#111827_45%,#020617)]"></div>
    </div>

    <main class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-5 sm:px-6 lg:px-8">
      <header class="mb-6 flex flex-col gap-4 rounded-3xl border border-white/10 bg-white/10 p-5 shadow-suave backdrop-blur md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.28em] text-blue-200">Proyecto Votación Online</p>
          
       
        </div>
      
      </header>

      <section id="loginView" class="grid flex-1 items-center gap-8 lg:grid-cols-[1.05fr_0.95fr]">
        <div class="rounded-[2rem] border border-white/10 bg-white/10 p-7 shadow-suave backdrop-blur md:p-10">
          <span class="inline-flex rounded-full bg-emerald-400/10 px-4 py-2 text-sm font-semibold text-emerald-200 ring-1 ring-emerald-300/20">Ingreso seguro del alumno</span>
          <h2 class="mt-6 text-4xl font-black leading-tight text-white md:text-6xl">Vota de forma simple, rápida y controlada.</h2>
        
        </div>

        <form id="loginForm" class="rounded-[2rem] border border-white/10 bg-white p-6 text-slate-900 shadow-suave md:p-8">
          <h2 class="text-2xl font-black text-slate-950">Iniciar sesión</h2>
          <p class="mt-2 text-sm text-slate-500">Ingrese el código y contraseña del alumno.</p>

          <label class="mt-6 block text-sm font-bold text-slate-700" for="codigo">Código del alumno</label>
          <input id="codigo" name="codigo" autocomplete="username" class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none ring-blue-500/20 transition focus:border-blue-500 focus:bg-white focus:ring-4" placeholder="Ejemplo: A001" required />

          <label class="mt-5 block text-sm font-bold text-slate-700" for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none ring-blue-500/20 transition focus:border-blue-500 focus:bg-white focus:ring-4" placeholder="Ejemplo: 123456" required />

          <button id="loginButton" class="mt-7 w-full rounded-2xl bg-blue-600 px-5 py-3 font-black text-white shadow-lg shadow-blue-600/25 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-400" type="submit">
            Entrar al sistema
          </button>
          <p id="loginMensaje" class="mt-4 min-h-6 text-sm font-semibold"></p>
        </form>
      </section>

      <section id="appView" class="hidden flex-1 rounded-[2rem] border border-white/10 bg-white p-4 text-slate-900 shadow-suave md:p-6">
        <div class="grid w-full gap-5 lg:grid-cols-[280px_1fr]">
          <aside class="rounded-[1.5rem] bg-slate-950 p-5 text-white">
            <p class="text-xs font-bold uppercase tracking-[0.25em] text-blue-200">Alumno autenticado</p>
            <h2 id="usuarioNombre" class="mt-3 text-2xl font-black"></h2>
            <p id="usuarioCodigo" class="mt-1 text-sm text-slate-300"></p>

            <nav class="mt-8 grid gap-3">
              <button class="menu-btn" data-vista="opciones">Ver opciones</button>
              <button class="menu-btn" data-vista="votar">Votar</button>
              <button class="menu-btn" data-vista="resultados">Ver resultados</button>
              <button class="menu-btn" data-vista="integridad">Verificar integridad</button>
              <button id="salirButton" class="rounded-2xl bg-white/10 px-4 py-3 text-left font-bold text-slate-200 transition hover:bg-red-500 hover:text-white">Salir</button>
            </nav>
          </aside>

          <section class="min-h-[520px] rounded-[1.5rem] bg-slate-50 p-5 md:p-8">
            <div id="alerta" class="mb-5 hidden rounded-2xl px-4 py-3 text-sm font-bold"></div>
            <div id="contenido"></div>
          </section>
        </div>
      </section>
    </main>

    <template id="loadingTemplate">
      <div class="flex min-h-64 items-center justify-center rounded-3xl border border-dashed border-slate-300 bg-white">
        <div class="text-center">
          <div class="mx-auto h-12 w-12 animate-spin rounded-full border-4 border-blue-100 border-t-blue-600"></div>
          <p class="mt-4 font-bold text-slate-600">Consultando servidor...</p>
        </div>
      </div>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
