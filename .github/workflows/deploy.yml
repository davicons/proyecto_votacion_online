name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  verificar:
    name: Verificar sintaxis y tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Verificar sintaxis
        run: |
          python -m py_compile datos.py
          python -m py_compile logica.py
          python -m py_compile presentacion.py
          echo "Sintaxis correcta en todos los archivos"

      - name: Correr tests
        run: |
          python -m pytest tests/ -v

  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Conectar al VPS y actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/votacionOnline
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            pkill -f "python3 /root/votacionOnline/datos.py" || true
            pkill -f "python3 /root/votacionOnline/logica.py" || true
            sleep 2
            nohup python3 /root/votacionOnline/datos.py > /root/votacionOnline/datos.log 2>&1 &
            nohup python3 /root/votacionOnline/logica.py > /root/votacionOnline/logica.log 2>&1 &
            echo "Deploy completado"
