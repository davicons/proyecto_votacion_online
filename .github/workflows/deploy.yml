name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  verificar:
    name: Verificar sintaxis y tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Verificar sintaxis
        run: |
          python -m py_compile datos.py
          python -m py_compile logica.py
          python -m py_compile presentacion.py
          echo "Sintaxis correcta en todos los archivos"

      - name: Correr tests
        run: |
          python -m pytest tests/ -v

  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Conectar al VPS y actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            apt-get install -y git python3 python3-venv python3-full --quiet

            if [ -d "/root/votacionOnline/.git" ]; then
              cd /root/votacionOnline
              git pull origin main
            else
              git clone https://github.com/davicons/proyecto_votacion_online.git /root/votacionOnline
              cd /root/votacionOnline
            fi

            if [ ! -d "/root/votacionOnline/venv" ]; then
              python3 -m venv /root/votacionOnline/venv
            fi

            /root/votacionOnline/venv/bin/pip install -r /root/votacionOnline/requirements.txt --quiet

            cat > /etc/systemd/system/votacion-datos.service << 'EOF'
            [Unit]
            Description=Servidor de datos votacion
            After=network.target postgresql.service

            [Service]
            ExecStart=/root/votacionOnline/venv/bin/python3 /root/votacionOnline/datos.py
            WorkingDirectory=/root/votacionOnline
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/systemd/system/votacion-logica.service << 'EOF'
            [Unit]
            Description=Servidor de logica votacion
            After=network.target votacion-datos.service

            [Service]
            ExecStart=/root/votacionOnline/venv/bin/python3 /root/votacionOnline/logica.py
            WorkingDirectory=/root/votacionOnline
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable votacion-datos votacion-logica
            systemctl restart votacion-datos votacion-logica
            echo "Deploy completado"
